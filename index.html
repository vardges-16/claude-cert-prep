<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Certification — Learning Path</title>
<style>
:root{
  --paper:#F2F5F1; --paper-2:#E7ECE6; --ink:#1C2B2A; --ink-soft:#48605C;
  --line:#D3DCD1; --accent:#C98A3E; --accent-soft:#F1DCB8;
  --good:#3E7A56; --good-soft:#DCEEDF; --bad:#B44B3F; --bad-soft:#F6DCD8;
  --card:#FFFFFF; --radius:16px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --arch-accent:#5B7FB5; --arch-accent-soft:#DCE5F3;
  --assoc-accent:#4C8C6B; --assoc-accent-soft:#DCEEE3;
  --prof-accent:#8B5FA8; --prof-accent-soft:#EADFF0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
body{display:flex;min-height:100vh;}
::selection{background:var(--accent-soft);}

#sidebar{width:270px; flex-shrink:0; background:var(--paper-2); border-right:1px solid var(--line); padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand{font-family:var(--serif); font-size:1.1rem; font-weight:700; padding:0 8px 10px;}
.brand small{display:block; font-family:var(--sans); font-weight:500; color:var(--ink-soft); font-size:.7rem; margin-top:2px;}

.track-switch{display:flex; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:16px; gap:2px;}
.track-btn{flex:1; min-width:44%; border:none; background:none; padding:9px 4px; border-radius:9px; font-size:.72rem; font-weight:700; cursor:pointer; color:var(--ink-soft); white-space:nowrap;}
.track-btn.active[data-track="dev"]{background:var(--accent-soft); color:#7A5220;}
.track-btn.active[data-track="arch"]{background:var(--arch-accent-soft); color:#2E4C7A;}
.track-btn.active[data-track="assoc"]{background:var(--assoc-accent-soft); color:#2C5F42;}
.track-btn.active[data-track="prof"]{background:var(--prof-accent-soft); color:#5D3D75;}

.nav-group{margin-top:14px;}
.nav-label{font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:0 10px; margin-bottom:6px;}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:.85rem; color:var(--ink); font-family:var(--sans);}
.nav-item:hover{background:var(--card);}
.nav-item.active{background:var(--card); box-shadow:0 1px 0 var(--line); font-weight:600;}
.nav-badge{margin-left:auto; font-size:.66rem; color:var(--ink-soft); background:var(--paper); border-radius:20px; padding:2px 7px; min-width:20px; text-align:center;}
.nav-badge.done{background:var(--good-soft); color:var(--good); font-weight:700;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line); flex-shrink:0;}
.dot.done{background:var(--good);} .dot.partial{background:var(--accent);}

#main{flex:1; min-width:0;}
#topbar{position:sticky; top:0; z-index:5; background:rgba(242,245,241,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:14px 34px; display:flex; align-items:center; gap:16px;}
.progress-shell{flex:1; height:8px; background:var(--paper-2); border-radius:8px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--good)); width:0%; transition:width .4s ease;}
#topbar .pct{font-size:.8rem; color:var(--ink-soft); white-space:nowrap;}
#content{max-width:780px; margin:0 auto; padding:40px 34px 100px;}

h1.page-title{font-family:var(--serif); font-size:2rem; margin:0 0 6px;}
.subtitle{color:var(--ink-soft); margin:0 0 26px; font-size:1rem; line-height:1.55;}
.weight-pill{display:inline-block; background:var(--accent-soft); color:#7A5220; font-size:.74rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:14px;}
.weight-pill.arch{background:var(--arch-accent-soft); color:#2E4C7A;}
.weight-pill.assoc{background:var(--assoc-accent-soft); color:#2C5F42;}
.weight-pill.prof{background:var(--prof-accent-soft); color:#5D3D75;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px 26px; margin-bottom:20px;}
.card h2{font-family:var(--serif); font-size:1.28rem; margin:0 0 12px;}
.card h3{font-size:1rem; margin:18px 0 8px;}
.card p{line-height:1.75; margin:0 0 14px; font-size:.97rem;}
.card p:last-child{margin-bottom:0;}
.analogy{background:var(--paper); border-left:4px solid var(--accent); padding:14px 18px; border-radius:0 10px 10px 0; margin:14px 0; font-size:.94rem; line-height:1.7;}
.analogy b{color:var(--accent); text-transform:uppercase; font-size:.68rem; letter-spacing:.06em; display:block; margin-bottom:4px;}
.why{background:var(--good-soft); border-left:4px solid var(--good); padding:14px 18px; border-radius:0 10px 10px 0; margin:14px 0; font-size:.94rem; line-height:1.7;}
.why b{color:var(--good); text-transform:uppercase; font-size:.68rem; letter-spacing:.06em; display:block; margin-bottom:4px;}
.deep{background:#F5F0E6; border-left:4px solid #9A7B3E; padding:14px 18px; border-radius:0 10px 10px 0; margin:14px 0; font-size:.93rem; line-height:1.7;}
.deep b{color:#9A7B3E; text-transform:uppercase; font-size:.68rem; letter-spacing:.06em; display:block; margin-bottom:4px;}
pre{background:#12201E; color:#E7F0EA; padding:16px 18px; border-radius:10px; overflow-x:auto; font-size:.8rem; line-height:1.6; margin:14px 0;}
code{font-family:'SF Mono', Menlo, Consolas, monospace;}
.card :not(pre) > code{background:var(--paper-2); padding:1px 6px; border-radius:5px; font-size:.85em;}
table.ref{width:100%; border-collapse:collapse; margin:14px 0; font-size:.88rem;}
table.ref th, table.ref td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;}
table.ref th{background:var(--paper);}

.mark-btn{display:inline-flex; align-items:center; gap:8px; background:var(--paper-2); border:1px solid var(--line); padding:9px 16px; border-radius:24px; cursor:pointer; font-size:.84rem; font-weight:600; color:var(--ink);}
.mark-btn.done{background:var(--good-soft); border-color:var(--good); color:var(--good);}

.quiz-q{border-top:1px solid var(--line); padding-top:18px; margin-top:18px;}
.quiz-q:first-child{border-top:none; margin-top:0; padding-top:0;}
.quiz-q p.qtext{font-weight:600; margin-bottom:10px;}
.opt{display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); padding:10px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer; font-size:.9rem; font-family:var(--sans); color:var(--ink);}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:var(--good-soft); border-color:var(--good); font-weight:600;}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad);}
.opt[disabled]{cursor:default;}
.explain{margin-top:10px; padding:12px 14px; background:var(--paper); border-radius:10px; font-size:.88rem; line-height:1.6; display:none;}
.explain.show{display:block;}
.quiz-summary{background:var(--paper); border-radius:12px; padding:18px 22px; text-align:center; margin-top:16px; font-size:1rem;}
.quiz-summary b{font-size:1.4rem; display:block; margin-bottom:2px;}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center;}
.stat .num{font-family:var(--serif); font-size:1.6rem; font-weight:700;}
.stat .lbl{font-size:.73rem; color:var(--ink-soft); margin-top:2px;}
.path{display:flex; flex-direction:column; gap:10px;}
.path-item{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; cursor:pointer;}
.path-item:hover{border-color:var(--accent);}
.path-num{width:34px; height:34px; border-radius:50%; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; flex-shrink:0;}
.path-num.done{background:var(--good); color:#fff;}
.path-body{flex:1;} .path-body .t{font-weight:600; font-size:.93rem;} .path-body .w{font-size:.76rem; color:var(--ink-soft);}
.path-arrow{color:var(--ink-soft); font-size:1.1rem;}

.timer{font-family:var(--serif); font-size:1.4rem; font-weight:700; color:var(--accent);}
.exam-nav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.exam-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.72rem;}
.exam-nav button.answered{background:var(--paper-2);}
.exam-nav button.current{border-color:var(--accent); border-width:2px;}
.big-btn{background:var(--ink); color:#fff; border:none; padding:12px 24px; border-radius:12px; font-size:.93rem; font-weight:600; cursor:pointer;}
.big-btn:hover{opacity:.9;}
.ghost-btn{background:none; border:1px solid var(--line); padding:12px 20px; border-radius:12px; font-size:.88rem; cursor:pointer; color:var(--ink);}

.lifecycle-wrap{margin:0 0 30px; padding:22px 24px; background:var(--card); border:1px solid var(--line); border-radius:16px;}
.lifecycle-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:4px;}
.lifecycle-sub{font-size:.78rem; color:var(--ink-soft); margin-bottom:20px; line-height:1.4;}
.flow-row{display:flex; flex-wrap:wrap; gap:14px 0; align-items:stretch; margin-bottom:22px;}
.flow-node{position:relative; display:flex; align-items:center; gap:8px; background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:10px 30px 10px 14px; margin-right:20px; font-size:.82rem; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.flow-node.hi{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:700; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), 0 2px 10px rgba(0,0,0,.06);}
.flow-node.hi.arch{background:var(--arch-accent-soft); border-color:var(--arch-accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--arch-accent) 18%, transparent), 0 2px 10px rgba(0,0,0,.06);}
.flow-badge{flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--line); color:var(--ink-soft); font-size:.66rem; font-weight:800; display:flex; align-items:center; justify-content:center;}
.flow-node.hi .flow-badge{background:var(--accent); color:#fff;}
.flow-node.hi.arch .flow-badge{background:var(--arch-accent);}
.flow-node:not(:last-child)::after{content:'→'; position:absolute; right:-19px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:.95rem; font-weight:700;}
.flow-captions{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); padding-top:16px;}
.flow-caption{display:flex; align-items:flex-start; gap:10px;}
.flow-caption .flow-badge{margin-top:1px;}
.flow-caption-text{font-size:.82rem; color:var(--ink); line-height:1.4;}
.flow-caption-text b{font-weight:700;}

@media(max-width:820px){
  body{flex-direction:column;}
  #sidebar{width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line);}
  #content{padding:24px 18px 80px;}
  .stat-grid{grid-template-columns:1fr;}
}

.part-banner{margin:34px 0 16px;padding:18px 22px;background:var(--arch-accent-soft);border-left:5px solid var(--arch-accent);border-radius:0 12px 12px 0}
.part-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--arch-accent);font-weight:700}
.part-title{font-family:var(--serif);font-size:1.3rem;margin:2px 0 6px}
.part-banner p{margin:0;line-height:1.65;font-size:.93rem;color:var(--ink-soft)}
.card .bridge{font-size:.88rem;font-style:italic;color:var(--ink-soft);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 14px}
figure.diagram{margin:16px 0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.roadmap-wrap{margin:0 0 24px}
.outline{margin:10px 0 0;padding-left:22px;line-height:1.9;font-size:.93rem}
.outline a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink-soft)}
.outline span{color:var(--ink-soft)}

.layer-strip{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 12px;font-size:.68rem}
.ls-label{text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:700;margin-right:4px}
.ls-seg{padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line)}
.ls-seg.on{background:var(--arch-accent);color:#fff;border-color:var(--arch-accent);font-weight:700}
.case{background:var(--arch-accent-soft);border-left:4px solid var(--arch-accent);padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:.94rem;line-height:1.7}
.case b{color:var(--arch-accent);text-transform:uppercase;font-size:.68rem;letter-spacing:.06em;display:block;margin-bottom:4px}
.xlinks{margin:16px 0 4px;display:grid;gap:6px}
.xlink{font-size:.88rem;line-height:1.5}
.xk{display:inline-block;min-width:78px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-soft)}
.xlink.builds-on .xk{color:var(--good)} .xlink.leads-to .xk{color:var(--accent)}
.xw{color:var(--ink-soft)}
a.xref{color:var(--ink);font-weight:600;border-bottom:1px dotted var(--ink-soft);text-decoration:none;cursor:pointer}
a.xref:hover{color:var(--arch-accent);border-bottom-color:var(--arch-accent)}
.part-recap{margin:-6px 0 26px;padding:14px 20px;background:var(--paper-2);border:1px dashed var(--ink-soft);border-radius:12px;font-size:.93rem;line-height:1.7}
.part-recap b,.plug-box b{display:block;text-transform:uppercase;letter-spacing:.07em;font-size:.68rem;color:var(--ink-soft);margin-bottom:4px}
.plug-box{margin:26px 0;padding:18px 22px;background:var(--arch-accent-soft);border:1px solid var(--arch-accent);border-radius:14px;line-height:1.75;font-size:.95rem}
.card.flash{box-shadow:0 0 0 3px var(--arch-accent)}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="brand" id="brand-label">Certification Path</div>
  <div class="track-switch">
    <button class="track-btn" data-track="dev">👨‍💻 Developer</button>
    <button class="track-btn" data-track="arch">🏗️ Architect</button>
    <button class="track-btn" data-track="assoc">📋 Associate</button>
    <button class="track-btn" data-track="prof">🎓 Arch. Pro</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Start here</div>
    <button class="nav-item" data-route="home"><span class="dot"></span> Home</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Learn</div>
    <div id="nav-domains"></div>
  </div>
  <div class="nav-group">
    <div class="nav-label">Practice</div>
    <button class="nav-item" data-route="mock"><span class="dot"></span> Full Mock Exam</button>
  </div>
</nav>

<main id="main">
  <div id="topbar">
    <div class="progress-shell"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="pct" id="progress-pct">0% ready</div>
  </div>
  <div id="content"></div>
</main>

<script src="data/developer.js"></script>
<script src="data/architect.js"></script>
<script src="data/associate.js"></script>
<script src="data/architect-professional.js"></script>
<script src="js/diag.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
